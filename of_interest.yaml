# Contracts worth a reviewer's attention for how they were awarded, read from
# the District's own paperwork.
#
# These are not errors and not findings of wrongdoing. Each entry says what the
# posted documents show about how the award (or its current period) was made,
# quotes them, and names the document and page. DC's `market_type` field says
# "Open" or "Set Aside" for nearly all of these, so it can't be used to find them
# (see analysis/competition.py).
#
# How the list was built: analysis/review_leads.py nominated current contracts
# whose document filenames mention sole source, emergency, letter contract or an
# extension, or whose record looked odd; each was then read by hand. Contracts
# not nominated were not read, so this is not a complete list of non-competitive
# awards. Most nominated contracts turned out ordinary and are not listed.
#
# A contract can sit in more than one category. "read_from_image" means the PDF
# had no usable text layer and the page was read as an image.

checked: '2026-10-12'
categories:
  # `means` is the plain-language hover text on the site; `law` is the
  # authority the paperwork cites, kept for reference.
  sole_source:
    label: Sole source
    means: >-
      The District picked one company without asking others to bid, saying it was the only
      one that could do the work.
    law: D.C. Code § 2-354.04 (unless the entry says the citation could not be seen)
  sole_source_past_final_option:
    label: Sole-source extension past the last option
    means: >-
      The contract had used up all the extra years it allowed, and the District extended it
      anyway, without asking others to bid, usually to keep the work going until a new
      contract is in place.
    law: D.C. Code § 2-354.04; 27 DCMR 2005.2(b)
  exempt_from_competition:
    label: Exempt from competition
    means: >-
      The District didn't have to ask others to bid because the law exempts this kind of
      purchase, for example support for software it already owns from the only company that
      can provide it, patented items bought from the patent owner, or a purchase where law
      says whom the District must contract with (in one entry here, a court order).
    law: D.C. Code § 2-354.13
  emergency:
    label: Emergency procurement
    means: >-
      Bought quickly without the usual bidding because the agency said there was an
      emergency. Emergency contracts are meant to be short.
    law: D.C. Code § 2-354.05
  letter_contract:
    label: Letter contract
    means: >-
      The company started work on a short preliminary agreement before the full contract was
      signed, usually while waiting for approval.
    law: 27 DCMR 2425
  special_pilot:
    label: Special pilot procurement
    means: >-
      Bought without the usual bidding under a law for unusual or unique situations, such as
      meeting a new District need or obtaining a new technology.
    law: D.C. Code § 2-354.08
  rider_or_cooperative:
    label: Rider or cooperative purchase
    means: >-
      Bought off a contract that already existed, often one another government or agency
      had competed, instead of running a new competition.
    law: D.C. Code § 2-354.11, or a rider clause in the existing contract
  grew_after_award:
    label: Grew or slipped after award
    means: >-
      After it was awarded without bidding, the contract got much bigger or its delivery was
      pushed back a long way.
