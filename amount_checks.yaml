# Checks of DC's per-period contract amounts against the District's own paperwork.
#
# The site shows and totals base-period amounts only because of these two
# samples (see the About page). Each row is one sampled period: what DC's site
# lists, what the posted paperwork says, and where that was read. A verdict of
# "differs" means the posted paperwork states a different amount for that
# period; "no_paperwork" means nothing posted states it.

checked: '2026-10-12'
method: '60 option periods and 60 base periods drawn at random (DuckDB setseed(0.42), order by random(),
  limit 60) from the contracts table, CW contract numbers only. For each, the paperwork posted on DC''s
  site that states that period''s amount was found and read: the signed option-exercise modification,
  else the contract''s price schedule, else the price-reasonableness D&F (for base periods: the signed
  award, then any modification, then the D&F).'
summary:
  option_periods:
    sampled: 60
    with_paperwork: 48
    differs: 14
    counts:
      matches: 34
      differs: 14
      no_paperwork: 11
      ceiling_vs_order: 1
  base_periods:
    sampled: 60
    with_paperwork: 48
    differs: 5
    counts:
      differs: 5
      matches: 43
      no_paperwork: 12
