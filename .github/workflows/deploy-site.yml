name: Deploy site to Cloudflare Pages

# Cloudflare Pages direct upload does not publish on push by itself, so this
# does. The site has no build step and reads its data from the Hugging Face
# dataset at load time, so it only needs redeploying when site/ changes; the
# weekly data refresh does not touch it.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
  workflow_dispatch:

# A push landing while a deploy is in flight should supersede it, not race it.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Until the Cloudflare secrets are set the site is deployed by hand
      # (`wrangler pages deploy site --project-name=dc-procurement`), and this
      # job says so rather than failing every push.
      - name: Check for Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping the deploy. See docs/SCHEDULING.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy site --project-name=dc-procurement --branch=main --commit-dirty=true
