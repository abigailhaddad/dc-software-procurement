# Vendor identity decisions.
#
# The District does not normalise vendor names. "CDW Government" is recorded
# under three spellings in the technology payments alone, and left unmerged its
# spending splits three ways and vendor concentration comes out too low.
#
# Two kinds of thing live here. `strip_suffixes` and `strip_punctuation` are
# mechanical rules. `merged_by_rule` is the record of what those rules actually
# combine in the published figures, written down so the identity claims can be
# checked by a person rather than trusted because a regex produced them. Any
# entry there that looks wrong should move into `keep_separate`.
#
# Regenerate the record with: uv run python analysis/refresh_vendor_aliases.py

strip_suffixes:
  - INC
  - INCORPORATED
  - LLC
  - LLP
  - LP
  - CORP
  - CORPORATION
  - COMPANY
  - CO
  - PC
  - PLLC
  - LTD
  - LIMITED
  - GROUP
  - THE
  - DBA

# Everything that is not a letter, digit or space is replaced with a space
# before suffixes are stripped, so "ANNIE'S HARDWARE" and "ANNIE S HARDWARE"
# land on the same key, as do "DIGI DOCS INC/DOCUMENT MGERS" and its
# space-separated twin.
strip_punctuation: true

# Names the rules do NOT merge, and the reason. These are decisions, not
# oversights: change one and the concentration figures change with it.
keep_separate:
  - names: [CDW GOVERNMENT, CDW]
    reason: >
      CDW Government LLC is the public-sector arm and CDW LLC is the parent.
      They are billed separately and are left separate here. Merging them would
      move CDW from $55.1M to $58.4M in FY2021-2025 technology payments.
  - names: [GCS, GCS SIGAL]
    reason: >
      GCS, Inc. and GCS-Sigal, LLC are different entities; the joint venture is
      not the same company as the firm that formed it.
  - names: [SODEXOMAGIC, SODEXHOMAGIC]
    reason: >
      Two spellings appear across the payments table. They are almost certainly
      the same company, but neither appears in the technology set, so the
      question is left open rather than guessed at.

# What the rules above merge in the FY2021-2025 technology payment set.
# Generated, and committed so the merges are reviewable. Dollar figures are the
# combined total for the group.
merged_by_rule:
