# Errors in DC's records, found by reading the District's own paperwork.
#
# Each entry is a place where DC's site (contracts.ocp.dc.gov) says one thing
# and the signed contract, modification or D&F posted beside it says another.
# Every entry names the document and page it rests on, so it can be checked
# rather than trusted. Entries were read by hand; "read_from_image" means the
# PDF had no usable text layer and the page was read as an image.
#
# Rules:
#   - Record only what a posted document contradicts. "Looks too big" is a
#     lead (analysis/review_leads.py), not a correction.
#   - `published` is the value exactly as DC's site shows it. If DC changes the
#     record, the entry no longer matches and should be re-checked.
#   - A modification raising an amount that DC's site never updated is NOT
#     recorded here: the site appears to show each period's amount as first
#     entered, so that is how the field works rather than a typo. Applying a
#     handful of those would make those contracts inconsistent with the rest.
#   - Never infer a correction from a vendor or title alone.

checked: 2026-10-12

